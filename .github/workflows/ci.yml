name: Continuous Integration

on:
  pull_request:
    branches: ['**', '!update/**', '!pr/**']
  push:
    branches: ['**', '!update/**', '!pr/**']
    tags: [v*]

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


concurrency:
  group: ${{ github.workflow }} @ ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test
    strategy:
      matrix:
        os: [ubuntu-22.04]
        scala: [2.12, 2.13, 3]
        java: [temurin@17, temurin@21]
        project: [laserdiscJVM, laserdiscNative, laserdiscJS]
        exclude:
          - scala: 2.12
            java: temurin@21
          - scala: 3
            java: temurin@21
          - project: laserdiscNative
            java: temurin@21
          - project: laserdiscJS
            java: temurin@21
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout current branch (full)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Setup Java (temurin@17)
        id: setup-java-temurin-17
        if: matrix.java == 'temurin@17'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: sbt

      - name: sbt update
        if: matrix.java == 'temurin@17' && steps.setup-java-temurin-17.outputs.cache-hit == 'false'
        run: sbt +update

      - name: Setup Java (temurin@21)
        id: setup-java-temurin-21
        if: matrix.java == 'temurin@21'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: sbt

      - name: sbt update
        if: matrix.java == 'temurin@21' && steps.setup-java-temurin-21.outputs.cache-hit == 'false'
        run: sbt +update

      - name: Start up Redis
        run: 'docker run -p 6379:6379 -d redis:alpine'

      - name: Start up KeyDb
        run: 'docker run -p 6380:6379 -d eqalpha/keydb'

      - name: Start up Valkey
        run: 'docker run -p 6381:6379 -d valkey/valkey:alpine'

      - name: Start up a Redis cluster
        run: 'docker run -p 7100:7100 -p 7101:7101 -p 7102:7102 -p 7103:7103 -d --entrypoint sh redis:alpine -c ''redis-server --port 7100 --cluster-enabled yes --cluster-config-file nodes-7100.conf --protected-mode no --daemonize yes; redis-server --port 7101 --cluster-enabled yes --cluster-config-file nodes-7101.conf --protected-mode no --daemonize yes; redis-server --port 7102 --cluster-enabled yes --cluster-config-file nodes-7102.conf --protected-mode no --daemonize yes; exec redis-server --port 7103 --cluster-enabled yes --cluster-config-file nodes-7103.conf --protected-mode no'''

      - name: Start up a KeyDb cluster
        run: 'docker run -p 7110:7110 -p 7111:7111 -p 7112:7112 -p 7113:7113 -d --entrypoint sh eqalpha/keydb -c ''keydb-server --port 7110 --cluster-enabled yes --cluster-config-file nodes-7110.conf --protected-mode no --daemonize yes; keydb-server --port 7111 --cluster-enabled yes --cluster-config-file nodes-7111.conf --protected-mode no --daemonize yes; keydb-server --port 7112 --cluster-enabled yes --cluster-config-file nodes-7112.conf --protected-mode no --daemonize yes; exec keydb-server --port 7113 --cluster-enabled yes --cluster-config-file nodes-7113.conf --protected-mode no'''

      - name: Start up a Valkey cluster
        run: 'docker run -p 7120:7120 -p 7121:7121 -p 7122:7122 -p 7123:7123 -d --entrypoint sh valkey/valkey:alpine -c ''valkey-server --port 7120 --cluster-enabled yes --cluster-config-file nodes-7120.conf --protected-mode no --daemonize yes; valkey-server --port 7121 --cluster-enabled yes --cluster-config-file nodes-7121.conf --protected-mode no --daemonize yes; valkey-server --port 7122 --cluster-enabled yes --cluster-config-file nodes-7122.conf --protected-mode no --daemonize yes; exec valkey-server --port 7123 --cluster-enabled yes --cluster-config-file nodes-7123.conf --protected-mode no'''

      - name: Check that workflows are up to date
        run: sbt githubWorkflowCheck

      - name: Check headers and formatting
        if: matrix.java == 'temurin@17' && matrix.os == 'ubuntu-22.04'
        run: sbt 'project ${{ matrix.project }}' '++ ${{ matrix.scala }}' headerCheckAll scalafmtCheckAll 'project /' scalafmtSbtCheck

      - name: nativeLink
        if: matrix.project == 'laserdiscNative'
        run: sbt 'project ${{ matrix.project }}' '++ ${{ matrix.scala }}' Test/nativeLink

      - name: scalaJSLink
        if: matrix.project == 'laserdiscJS'
        run: sbt 'project ${{ matrix.project }}' '++ ${{ matrix.scala }}' Test/scalaJSLinkerResult

      - name: Test
        run: sbt 'project ${{ matrix.project }}' '++ ${{ matrix.scala }}' test

      - name: Check binary compatibility
        if: matrix.java == 'temurin@17' && matrix.os == 'ubuntu-22.04'
        run: sbt 'project ${{ matrix.project }}' '++ ${{ matrix.scala }}' mimaReportBinaryIssues

      - name: Generate API documentation
        if: matrix.java == 'temurin@17' && matrix.os == 'ubuntu-22.04'
        run: sbt 'project ${{ matrix.project }}' '++ ${{ matrix.scala }}' doc

      - name: Make target directories
        if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master')
        run: mkdir -p fs2/native/target fs2/jvm/target core/native/target core/js/target circe/js/target cli/.js/target circe/jvm/target cli/.native/target circe/native/target cli/.jvm/target fs2/js/target core/jvm/target project/target

      - name: Compress target directories
        if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master')
        run: tar cf targets.tar fs2/native/target fs2/jvm/target core/native/target core/js/target circe/js/target cli/.js/target circe/jvm/target cli/.native/target circe/native/target cli/.jvm/target fs2/js/target core/jvm/target project/target

      - name: Upload target directories
        if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master')
        uses: actions/upload-artifact@v5
        with:
          name: target-${{ matrix.os }}-${{ matrix.java }}-${{ matrix.scala }}-${{ matrix.project }}
          path: targets.tar

  publish:
    name: Publish Artifacts
    needs: [build]
    if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master')
    strategy:
      matrix:
        os: [ubuntu-22.04]
        java: [temurin@17]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout current branch (full)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Setup Java (temurin@17)
        id: setup-java-temurin-17
        if: matrix.java == 'temurin@17'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: sbt

      - name: sbt update
        if: matrix.java == 'temurin@17' && steps.setup-java-temurin-17.outputs.cache-hit == 'false'
        run: sbt +update

      - name: Setup Java (temurin@21)
        id: setup-java-temurin-21
        if: matrix.java == 'temurin@21'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: sbt

      - name: sbt update
        if: matrix.java == 'temurin@21' && steps.setup-java-temurin-21.outputs.cache-hit == 'false'
        run: sbt +update

      - name: Download target directories (2.12, laserdiscJVM)
        uses: actions/download-artifact@v6
        with:
          name: target-${{ matrix.os }}-${{ matrix.java }}-2.12-laserdiscJVM

      - name: Inflate target directories (2.12, laserdiscJVM)
        run: |
          tar xf targets.tar
          rm targets.tar

      - name: Download target directories (2.12, laserdiscNative)
        uses: actions/download-artifact@v6
        with:
          name: target-${{ matrix.os }}-${{ matrix.java }}-2.12-laserdiscNative

      - name: Inflate target directories (2.12, laserdiscNative)
        run: |
          tar xf targets.tar
          rm targets.tar

      - name: Download target directories (2.12, laserdiscJS)
        uses: actions/download-artifact@v6
        with:
          name: target-${{ matrix.os }}-${{ matrix.java }}-2.12-laserdiscJS

      - name: Inflate target directories (2.12, laserdiscJS)
        run: |
          tar xf targets.tar
          rm targets.tar

      - name: Download target directories (2.13, laserdiscJVM)
        uses: actions/download-artifact@v6
        with:
          name: target-${{ matrix.os }}-${{ matrix.java }}-2.13-laserdiscJVM

      - name: Inflate target directories (2.13, laserdiscJVM)
        run: |
          tar xf targets.tar
          rm targets.tar

      - name: Download target directories (2.13, laserdiscNative)
        uses: actions/download-artifact@v6
        with:
          name: target-${{ matrix.os }}-${{ matrix.java }}-2.13-laserdiscNative

      - name: Inflate target directories (2.13, laserdiscNative)
        run: |
          tar xf targets.tar
          rm targets.tar

      - name: Download target directories (2.13, laserdiscJS)
        uses: actions/download-artifact@v6
        with:
          name: target-${{ matrix.os }}-${{ matrix.java }}-2.13-laserdiscJS

      - name: Inflate target directories (2.13, laserdiscJS)
        run: |
          tar xf targets.tar
          rm targets.tar

      - name: Download target directories (3, laserdiscJVM)
        uses: actions/download-artifact@v6
        with:
          name: target-${{ matrix.os }}-${{ matrix.java }}-3-laserdiscJVM

      - name: Inflate target directories (3, laserdiscJVM)
        run: |
          tar xf targets.tar
          rm targets.tar

      - name: Download target directories (3, laserdiscNative)
        uses: actions/download-artifact@v6
        with:
          name: target-${{ matrix.os }}-${{ matrix.java }}-3-laserdiscNative

      - name: Inflate target directories (3, laserdiscNative)
        run: |
          tar xf targets.tar
          rm targets.tar

      - name: Download target directories (3, laserdiscJS)
        uses: actions/download-artifact@v6
        with:
          name: target-${{ matrix.os }}-${{ matrix.java }}-3-laserdiscJS

      - name: Inflate target directories (3, laserdiscJS)
        run: |
          tar xf targets.tar
          rm targets.tar

      - name: Import signing key
        if: env.PGP_SECRET != '' && env.PGP_PASSPHRASE == ''
        env:
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
        run: echo $PGP_SECRET | base64 -d -i - | gpg --import

      - name: Import signing key and strip passphrase
        if: env.PGP_SECRET != '' && env.PGP_PASSPHRASE != ''
        env:
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
        run: |
          echo "$PGP_SECRET" | base64 -d -i - > /tmp/signing-key.gpg
          echo "$PGP_PASSPHRASE" | gpg --pinentry-mode loopback --passphrase-fd 0 --import /tmp/signing-key.gpg
          (echo "$PGP_PASSPHRASE"; echo; echo) | gpg --command-fd 0 --pinentry-mode loopback --change-passphrase $(gpg --list-secret-keys --with-colons 2> /dev/null | grep '^sec:' | cut --delimiter ':' --fields 5 | tail -n 1)

      - name: Publish
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_CREDENTIAL_HOST: ${{ secrets.SONATYPE_CREDENTIAL_HOST }}
        run: sbt tlCiRelease

  dependency-submission:
    name: Submit Dependencies
    if: github.event.repository.fork == false && github.event_name != 'pull_request'
    strategy:
      matrix:
        os: [ubuntu-22.04]
        java: [temurin@17]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout current branch (full)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Setup Java (temurin@17)
        id: setup-java-temurin-17
        if: matrix.java == 'temurin@17'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: sbt

      - name: sbt update
        if: matrix.java == 'temurin@17' && steps.setup-java-temurin-17.outputs.cache-hit == 'false'
        run: sbt +update

      - name: Setup Java (temurin@21)
        id: setup-java-temurin-21
        if: matrix.java == 'temurin@21'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: sbt

      - name: sbt update
        if: matrix.java == 'temurin@21' && steps.setup-java-temurin-21.outputs.cache-hit == 'false'
        run: sbt +update

      - name: Submit Dependencies
        uses: scalacenter/sbt-dependency-submission@v2
        with:
          modules-ignore: fs2-bench_2.12 fs2-bench_2.13 fs2-bench_3 laserdiscjvm_2.12 laserdiscjvm_2.13 laserdiscjvm_3 laserdiscnative_2.12 laserdiscnative_2.13 laserdiscnative_3 docs_2.12 docs_2.13 docs_3 laserdisc-laws_2.12 laserdisc-laws_2.13 laserdisc-laws_3 laserdisc-laws_native0.5_2.12 laserdisc-laws_native0.5_2.13 laserdisc-laws_native0.5_3 core-bench_2.12 core-bench_2.13 core-bench_3 laserdisc-laws_sjs1_2.12 laserdisc-laws_sjs1_2.13 laserdisc-laws_sjs1_3 laserdiscjs_2.12 laserdiscjs_2.13 laserdiscjs_3
          configs-ignore: test scala-tool scala-doc-tool test-internal

  site:
    name: Generate Site
    strategy:
      matrix:
        os: [ubuntu-22.04]
        java: [temurin@17]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout current branch (full)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Setup Java (temurin@17)
        id: setup-java-temurin-17
        if: matrix.java == 'temurin@17'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: sbt

      - name: sbt update
        if: matrix.java == 'temurin@17' && steps.setup-java-temurin-17.outputs.cache-hit == 'false'
        run: sbt +update

      - name: Setup Java (temurin@21)
        id: setup-java-temurin-21
        if: matrix.java == 'temurin@21'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: sbt

      - name: sbt update
        if: matrix.java == 'temurin@21' && steps.setup-java-temurin-21.outputs.cache-hit == 'false'
        run: sbt +update

      - name: Generate site
        run: sbt ++3.9.0 docs/tlSite

      - name: Publish site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site/target/docs/site
          keep_files: true

  coverage:
    name: Check coverage
    strategy:
      matrix:
        os: [ubuntu-22.04]
        scala: [2.13.18]
        java: [temurin@17]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout current branch (full)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Setup Java (temurin@17)
        id: setup-java-temurin-17
        if: matrix.java == 'temurin@17'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: sbt

      - name: sbt update
        if: matrix.java == 'temurin@17' && steps.setup-java-temurin-17.outputs.cache-hit == 'false'
        run: sbt +update

      - name: Setup Java (temurin@21)
        id: setup-java-temurin-21
        if: matrix.java == 'temurin@21'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: sbt

      - name: sbt update
        if: matrix.java == 'temurin@21' && steps.setup-java-temurin-21.outputs.cache-hit == 'false'
        run: sbt +update

      - name: Start up Redis
        run: 'docker run -p 6379:6379 -d redis:alpine'

      - name: Start up KeyDb
        run: 'docker run -p 6380:6379 -d eqalpha/keydb'

      - name: Start up Valkey
        run: 'docker run -p 6381:6379 -d valkey/valkey:alpine'

      - name: Start up a Redis cluster
        run: 'docker run -p 7100:7100 -p 7101:7101 -p 7102:7102 -p 7103:7103 -d --entrypoint sh redis:alpine -c ''redis-server --port 7100 --cluster-enabled yes --cluster-config-file nodes-7100.conf --protected-mode no --daemonize yes; redis-server --port 7101 --cluster-enabled yes --cluster-config-file nodes-7101.conf --protected-mode no --daemonize yes; redis-server --port 7102 --cluster-enabled yes --cluster-config-file nodes-7102.conf --protected-mode no --daemonize yes; exec redis-server --port 7103 --cluster-enabled yes --cluster-config-file nodes-7103.conf --protected-mode no'''

      - name: Start up a KeyDb cluster
        run: 'docker run -p 7110:7110 -p 7111:7111 -p 7112:7112 -p 7113:7113 -d --entrypoint sh eqalpha/keydb -c ''keydb-server --port 7110 --cluster-enabled yes --cluster-config-file nodes-7110.conf --protected-mode no --daemonize yes; keydb-server --port 7111 --cluster-enabled yes --cluster-config-file nodes-7111.conf --protected-mode no --daemonize yes; keydb-server --port 7112 --cluster-enabled yes --cluster-config-file nodes-7112.conf --protected-mode no --daemonize yes; exec keydb-server --port 7113 --cluster-enabled yes --cluster-config-file nodes-7113.conf --protected-mode no'''

      - name: Start up a Valkey cluster
        run: 'docker run -p 7120:7120 -p 7121:7121 -p 7122:7122 -p 7123:7123 -d --entrypoint sh valkey/valkey:alpine -c ''valkey-server --port 7120 --cluster-enabled yes --cluster-config-file nodes-7120.conf --protected-mode no --daemonize yes; valkey-server --port 7121 --cluster-enabled yes --cluster-config-file nodes-7121.conf --protected-mode no --daemonize yes; valkey-server --port 7122 --cluster-enabled yes --cluster-config-file nodes-7122.conf --protected-mode no --daemonize yes; exec valkey-server --port 7123 --cluster-enabled yes --cluster-config-file nodes-7123.conf --protected-mode no'''

      - name: Run tests with coverage
        run: sbt '++ ${{ matrix.scala }}' coverage core/test laws/test fs2/test circe/test cli/test laserdiscJVM/coverageAggregate
